name: data

# Fetches fundamentals and daily closes and commits public/data.
# The "pages" workflow redeploys the site when this one completes.
on:
  workflow_dispatch:
    inputs:
      market:
        description: Which market to fetch
        type: choice
        options: [all, BIST, US]
        default: all
  schedule:
    # Cron is UTC, Monday to Friday.
    # 15:45 UTC = 18:45 in Istanbul, after the BIST close (18:10) plus the screener's 15-minute delay.
    - cron: '45 15 * * 1-5'
    # 21:45 UTC = 16:45 or 17:45 in New York, after the US close (16:00) in both summer and winter time.
    - cron: '45 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -t scripts

      - name: Pick the market
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ inputs.market }}
        run: |
          market=""
          if [ "$SCHEDULE" = "45 15 * * 1-5" ]; then market="BIST"; fi
          if [ "$SCHEDULE" = "45 21 * * 1-5" ]; then market="US"; fi
          if [ "$INPUT_MARKET" = "BIST" ] || [ "$INPUT_MARKET" = "US" ]; then market="$INPUT_MARKET"; fi
          if [ -n "$market" ]; then echo "args=--market $market" >> "$GITHUB_OUTPUT"; else echo "args=" >> "$GITHUB_OUTPUT"; fi

      # Exit code 1 means a market failed or came back partial; whatever was written is still valid
      # (failed markets keep their previous data), so the commit step runs either way.
      - name: Fetch
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_data.py ${{ steps.pick.outputs.args }}

      - name: Compare BIST figures with the Fintables snapshot
        if: always()
        run: python scripts/fetch_data.py --compare

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Veri güncellemesi $(date -u +%Y-%m-%d)"
            # main may have moved while the job ran: rebase the data commit on top and try again
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push rejected (attempt $attempt); rebasing on the latest main."
              git pull --rebase
            done
            echo "Could not push the data commit after three attempts." >&2
            exit 1
          fi

      - name: Fail the run if the fetch was incomplete
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "The fetch finished with errors; see the Fetch step and the job summary." >&2
          exit 1
