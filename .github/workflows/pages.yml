name: pages

# Builds the site with Vite and deploys it to GitHub Pages.
# Runs on every push to main, on demand, and after each "data" run
# (a push made by a workflow does not trigger other workflows, hence workflow_run).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [data]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/screener
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/screener/package-lock.json

      # With a committed package-lock.json the install is reproducible (npm ci); without one it is not.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Shared tests
        run: npm --prefix ../../shared test

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/screener/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
